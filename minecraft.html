<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>⛏️ Minecraft Classic Corner (2009) ⛏️</title>
<style>
  /* 2009 經典泥土方塊質感背景 */
  body {
    background-color: #3b2818;
    background-image: 
      linear-gradient(45deg, #2d1e12 25%, transparent 25%), 
      linear-gradient(-45deg, #2d1e12 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #2d1e12 75%), 
      linear-gradient(-45deg, transparent 75%, #2d1e12 75%);
    background-size: 32px 32px;
    background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    font-family: "Courier New", monospace;
    color: #FFFFFF;
    text-align: center;
    margin: 20px;
  }

  /* 經典 Minecraft 黃色斜體閃爍標語 (Splash Text) */
  .header-box {
    margin-bottom: 20px;
  }
  .mc-title {
    font-size: 36px;
    font-weight: bold;
    color: #CCCCCC;
    text-shadow: 4px 4px 0px #3F3F3F;
    letter-spacing: 3px;
    margin: 0;
  }
  .splash-text {
    color: #FFFF00;
    font-size: 16px;
    font-weight: bold;
    text-shadow: 2px 2px 0px #3F3F00;
    transform: rotate(-4deg);
    display: inline-block;
    margin-top: -5px;
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse {
    from { transform: rotate(-4deg) scale(1); }
    to { transform: rotate(-4deg) scale(1.08); }
  }

  /* 經典石頭質感主面板 */
  .stone-panel {
    width: 680px;
    margin: 0 auto;
    background-color: #7D7D7D;
    border: 4px solid #000000;
    box-shadow: inset 4px 4px 0px #A8A8A8, inset -4px -4px 0px #545454;
    padding: 16px;
  }

  /* 經典 Minecraft 立體按鈕 */
  .mc-btn {
    background-color: #7D7D7D;
    color: #FFFFFF;
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: 13px;
    padding: 8px 14px;
    border: 2px solid #000000;
    box-shadow: inset 2px 2px 0px #B8B8B8, inset -2px -2px 0px #4A4A4A;
    cursor: pointer;
    text-shadow: 2px 2px 0px #3F3F3F;
    margin: 3px;
  }
  .mc-btn:hover {
    background-color: #6B88FF;
    box-shadow: inset 2px 2px 0px #9EB0FF, inset -2px -2px 0px #3D52A8;
  }
  .mc-btn.active {
    background-color: #4CAF50;
    box-shadow: inset 2px 2px 0px #81C784, inset -2px -2px 0px #2E7D32;
  }

  /* 互動式方塊畫布 */
  #world-grid {
    display: grid;
    grid-template-columns: repeat(16, 32px);
    grid-template-rows: repeat(10, 32px);
    gap: 1px;
    background-color: #5599FF; /* 2009 經典亮藍天空 */
    border: 4px solid #222;
    width: fit-content;
    margin: 15px auto;
    cursor: crosshair;
  }

  .block {
    width: 32px;
    height: 32px;
    box-sizing: border-box;
  }
  .block:hover {
    outline: 2px solid #000000;
    z-index: 2;
  }

  /* 方塊材質貼圖 (純 CSS 像素風) */
  .air { background: transparent; }
  .grass { background: linear-gradient(to bottom, #4C9A2A 28%, #6B4423 28%); border: 1px solid #3B2412; }
  .stone { background-color: #888888; background-image: radial-gradient(#666 15%, transparent 16%); background-size: 8px 8px; border: 1px solid #555; }
  .wood { background-color: #9C7C4C; border: 2px solid #6B522E; }
  .diamond { background-color: #888888; background-image: radial-gradient(#00FFFF 25%, transparent 26%); background-size: 10px 10px; border: 1px solid #00AAAA; }
  .tnt { background-color: #D92626; border: 2px solid #800000; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 9px; font-weight: bold; }
</style>
</head>
<body>

  <div class="header-box">
    <h1 class="mc-title">MINECRAFT</h1>
    <div class="splash-text">Java Edition Classic 0.0.23a_01!</div>
  </div>

  <div class="stone-panel">
    <div style="margin-bottom: 10px; font-size: 13px;">
      <b>[ BLOCK PALETTE ]</b> Select a block & click on the sky to build!
    </div>

    <!-- 方塊選擇列 -->
    <div id="toolbar">
      <button class="mc-btn active" onclick="selectTool('grass', this)">🟩 Grass</button>
      <button class="mc-btn" onclick="selectTool('stone', this)">⬜ Stone</button>
      <button class="mc-btn" onclick="selectTool('wood', this)">🟫 Wood</button>
      <button class="mc-btn" onclick="selectTool('diamond', this)">💎 Diamond</button>
      <button class="mc-btn" onclick="selectTool('tnt', this)">🧨 TNT</button>
      <button class="mc-btn" onclick="selectTool('air', this)">⛏️ Mine (Erase)</button>
    </div>

    <!-- 16x10 互動方塊世界 -->
    <div id="world-grid"></div>

    <!-- 底部控制與返回按鈕 -->
    <div style="margin-top: 12px;">
      <button class="mc-btn" onclick="detonateTNT()" style="background-color:#B22222;">💥 DETONATE ALL TNT</button>
      <button class="mc-btn" onclick="resetWorld()">🔄 Reset Terrain</button>
      <br><br>
      <a href="index.html"><button class="mc-btn" style="width: 260px;">⬅️ Back to Main Blog</button></a>
    </div>
  </div>

<script>
  const grid = document.getElementById('world-grid');
  let currentTool = 'grass';
  const rows = 10;
  const cols = 16;

  function selectTool(tool, btn) {
    currentTool = tool;
    document.querySelectorAll('#toolbar .mc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  function setBlockType(cell, type) {
    cell.className = 'block ' + type;
    cell.dataset.type = type;
    cell.innerText = type === 'tnt' ? 'TNT' : '';
  }

  function resetWorld() {
    grid.innerHTML = '';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const cell = document.createElement('div');
        cell.dataset.r = r;
        cell.dataset.c = c;
        
        // 預設地形：第7層草地，第8層石頭，最底層鑽石礦
        if (r === 7) setBlockType(cell, 'grass');
        else if (r === 8) setBlockType(cell, 'stone');
        else if (r === 9) setBlockType(cell, (c % 4 === 0) ? 'diamond' : 'stone');
        else setBlockType(cell, 'air');

        cell.onclick = () => setBlockType(cell, currentTool);
        grid.appendChild(cell);
      }
    }
  }

  function detonateTNT() {
    const cells = Array.from(grid.children);
    let exploded = false;
    cells.forEach((cell, idx) => {
      if (cell.dataset.type === 'tnt') {
        exploded = true;
        const r = parseInt(cell.dataset.r);
        const c = parseInt(cell.dataset.c);
        // 炸掉周圍 3x3 範圍
        cells.forEach(target => {
          const tr = parseInt(target.dataset.r);
          const tc = parseInt(target.dataset.c);
          if (Math.abs(tr - r) <= 1 && Math.abs(tc - c) <= 1) {
            setBlockType(target, 'air');
          }
        });
      }
    });
    if (!exploded) alert("Place some TNT blocks first!");
  }

  resetWorld();
</script>
</body>
</html>
